<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Ice Agent</title>
  </head>
  <body>
    <div id="root">
      <!-- Static boot splash. React replaces this node as soon as the UI mounts, so it
           only stays on screen when the frontend fails to start — which would otherwise
           leave the transparent pet window completely invisible. -->
      <div
        style="
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 6px;
          font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
          color: #c4657b;
          user-select: none;
        "
      >
        <span style="font-size: 24px; line-height: 1">♡</span>
        <span style="font-size: 10px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase">
          Ice Agent
        </span>
        <span style="font-size: 10px; color: #9a7a84">starting…</span>
      </div>
    </div>
    <script src="/live2d/live2dcubismcore.min.js"></script>
    <script type="module" src="/frontend/main.tsx"></script>
  </body>
</html>
