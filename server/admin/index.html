<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Ice Agent · 服务器控制台</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='25' font-size='24'%3E%E2%9D%84%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="login" id="login" hidden>
      <form class="login-card" id="login-form" autocomplete="off" novalidate>
        <div class="login-brand">
          <span class="brand-mark" aria-hidden="true">❄</span>
          <div>
            <strong>Ice Agent</strong>
            <small>服务器控制台</small>
          </div>
        </div>
        <p class="login-lead">
          输入服务器访问令牌以继续。令牌位于数据目录的 <code>config.json</code>。
        </p>
        <label class="field">
          <span class="field-label">访问令牌</span>
          <input
            class="input"
            id="login-token"
            type="password"
            placeholder="Bearer token"
            spellcheck="false"
            required
          />
        </label>
        <label class="check">
          <input type="checkbox" id="login-remember" checked />
          <span>在本机浏览器记住</span>
        </label>
        <p class="form-error" id="login-error" hidden></p>
        <button class="btn btn-primary btn-block" id="login-submit" type="submit">登录</button>
        <p class="login-foot">控制台只接受来自 <code>127.0.0.1</code> 的访问。</p>
      </form>
    </div>

    <div class="shell" id="shell" hidden>
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">❄</span>
          <div>
            <strong>Ice Agent</strong>
            <small>服务器控制台</small>
          </div>
        </div>
        <nav class="nav" id="nav">
          <a class="nav-item" data-view="dashboard" href="#/dashboard">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="3" width="7" height="7" rx="1.6" />
              <rect x="14" y="3" width="7" height="7" rx="1.6" />
              <rect x="3" y="14" width="7" height="7" rx="1.6" />
              <rect x="14" y="14" width="7" height="7" rx="1.6" />
            </svg>
            <span>概览</span>
          </a>
          <a class="nav-item" data-view="config" href="#/config">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <line x1="4" y1="7" x2="20" y2="7" />
              <line x1="4" y1="12" x2="20" y2="12" />
              <line x1="4" y1="17" x2="20" y2="17" />
              <circle cx="9" cy="7" r="2" />
              <circle cx="15" cy="12" r="2" />
              <circle cx="7" cy="17" r="2" />
            </svg>
            <span>配置</span>
          </a>
          <a class="nav-item" data-view="personas" href="#/personas">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="8" r="3.4" />
              <path d="M4.8 20c0-3.6 3.2-5.6 7.2-5.6s7.2 2 7.2 5.6" />
            </svg>
            <span>人格</span>
          </a>
          <a class="nav-item" data-view="sessions" href="#/sessions">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 5.5h16v10.5H10l-5 4v-4H4z" />
              <line x1="8" y1="9.5" x2="16" y2="9.5" />
              <line x1="8" y1="12.8" x2="13" y2="12.8" />
            </svg>
            <span>会话</span>
          </a>
          <a class="nav-item" data-view="characters" href="#/characters">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3.5" y="4.5" width="17" height="15" rx="2.4" />
              <circle cx="9" cy="10" r="1.7" />
              <path d="M4.5 17.5l4.6-4.2 3.4 3.1 2.8-2.5 4.2 3.9" />
            </svg>
            <span>角色</span>
          </a>
          <a class="nav-item" data-view="tester" href="#/tester">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="4.5" width="18" height="15" rx="2.4" />
              <path d="M7 9.5l3 2.6-3 2.6" />
              <line x1="12.5" y1="15" x2="17" y2="15" />
            </svg>
            <span>接口测试</span>
          </a>
          <a class="nav-item" data-view="logs" href="#/logs">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <line x1="5" y1="6.5" x2="19" y2="6.5" />
              <line x1="5" y1="12" x2="19" y2="12" />
              <line x1="5" y1="17.5" x2="14" y2="17.5" />
            </svg>
            <span>请求日志</span>
          </a>
        </nav>
        <div class="sidebar-foot">
          <span class="dot" id="server-dot"></span>
          <span id="server-line">连接中…</span>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <h1 id="view-title">概览</h1>
          <div class="topbar-actions">
            <span class="pill" id="health-pill">检测中…</span>
            <button
              class="icon-button"
              id="refresh"
              type="button"
              title="刷新当前页"
              aria-label="刷新"
            >
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 12a8 8 0 1 1-2.6-5.9" />
                <path d="M20 4.5V10h-5.4" />
              </svg>
            </button>
            <button class="btn btn-ghost" id="logout" type="button">退出</button>
          </div>
        </header>
        <section class="view" id="view"></section>
      </main>
    </div>

    <div class="toasts" id="toast-host" aria-live="polite"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
