[package]
name = "ice-agent"
version = "0.1.0"
description = "Ice Agent desktop pet"
authors = ["Ice Agent"]
edition = "2021"

[lib]
name = "ice_agent_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.8", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
